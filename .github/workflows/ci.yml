# Homelab workspace — lint clone helper + workflows
name: CI

on:
  push:
    branches: [main]
    paths:
      - "clone-labs.sh"
      - "repos.json"
      - "Makefile"
      - ".yamllint.yaml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "clone-labs.sh"
      - "repos.json"
      - "Makefile"
      - ".yamllint.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Shell + workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64"
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint

      - name: bash -n / shellcheck / shfmt (clone-labs.sh)
        run: |
          set -euo pipefail
          bash -n clone-labs.sh
          shellcheck -S warning -e SC1090,SC1091 clone-labs.sh
          shfmt -d -i 2 -ci -sr clone-labs.sh

      - name: actionlint
        run: actionlint -color

      - name: yamllint workflows
        run: |
          yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable}}' .github/workflows/
